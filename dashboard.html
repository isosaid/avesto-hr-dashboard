<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обучение персонала — Авесто Групп</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#66B67A;--green-d:#4E9E63;--ink:#111827;--gray700:#374151;--gray600:#4B5563;
  --gray500:#6B7280;--gray400:#9CA3AF;--gray100:#F3F4F6;--gray50:#F9FAFB;--line:#E5E7EB;
  --card-sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--gray50);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px}

/* LOGIN */
#loginPage{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:radial-gradient(60% 100% at 80% 0%,rgba(102,182,122,.16),transparent 60%),
  radial-gradient(50% 80% at 0% 100%,rgba(102,182,122,.10),transparent 60%),#F0F3F1}
.lcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 36px;
  width:100%;max-width:400px;box-shadow:0 30px 70px rgba(16,24,40,.14)}
.llogo{width:52px;height:52px;border-radius:14px;background:var(--green);display:grid;
  place-items:center;margin-bottom:20px}
.lcard h1{font-size:22px;font-weight:600;margin-bottom:6px}
.lcard p{font-size:14px;color:var(--gray500);margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--gray700);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;outline:none;transition:border .15s}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(102,182,122,.15)}
.lbtn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.15s;margin-top:4px}
.lbtn:hover{background:var(--green-d)}
.lerr{color:#DC2626;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.lhint{margin-top:14px;font-size:12px;color:var(--gray400);text-align:center}

/* NAV */
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.nav-in{max-width:1440px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:4px}
.nav-label{font-size:14px;font-weight:600;color:var(--gray400);margin-right:16px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:64px;padding:0 20px;font-size:14px;font-weight:500;color:var(--gray500);cursor:pointer;
  background:none;border:none;transition:.15s}
.tab:hover{color:var(--ink)}.tab .t{font-weight:600}.tab .s{font-size:12px;opacity:.75;margin-top:1px}
.tab.on{color:var(--green)}
.tab.on::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--green);border-radius:2px 2px 0 0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-user{font-size:13px;color:var(--gray500)}
.ibtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
  color:var(--gray700);cursor:pointer;transition:.15s}
.ibtn:hover{background:var(--gray50)}.ibtn svg{width:15px;height:15px}
.ibtn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.ibtn.pri:hover{background:var(--green-d)}

/* CONTENT */
.head{margin-bottom:32px}
.head h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.head p{color:var(--gray600);font-size:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:24px}
@media(max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--card-sh);
  border:1px solid var(--gray100)}
.kpi .ic{width:48px;height:48px;border-radius:12px;background:rgba(102,182,122,.1);
  display:grid;place-items:center;color:var(--green);margin-bottom:16px}
.kpi .ic svg{width:24px;height:24px}
.kpi .v{font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{font-size:14px;color:var(--gray500);margin-top:4px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--card-sh);
  border:1px solid var(--gray100);margin-bottom:24px}
.card h3{font-size:18px;font-weight:600;margin-bottom:24px}

/* PLAN */
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.donut-box{display:flex;align-items:center;justify-content:center}
.donut-rel{position:relative;width:220px;height:220px}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-center .pc{font-size:28px;font-weight:700}.donut-center .pl{font-size:14px;color:var(--gray600)}
.plan-stats{display:flex;flex-direction:column;gap:14px;justify-content:center}
.pstat{display:flex;align-items:center;justify-content:space-between;padding:15px;border-radius:12px}
.pstat.g{background:#F0FDF4}.pstat.x{background:var(--gray50)}
.pstat .pl{font-size:14px;color:var(--gray600);margin-bottom:4px}
.pstat .pv{font-size:22px;font-weight:600}
.pstat.done .pv{color:var(--green)}
.pcircle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.pcircle.g{background:var(--green)}.pcircle.x{background:#D1D5DB}.pcircle svg{width:22px;height:22px}
.nocourse{margin-top:24px;padding-top:20px;border-top:1px solid var(--gray100)}
.nocourse h4{font-size:14px;font-weight:600;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 11px;background:#FEF2F2;color:#B91C1C;font-size:13px;border-radius:8px}

/* CHART */
.chart-svg{width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center;padding-top:18px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--gray600)}
.legend i{width:10px;height:10px;border-radius:50%}

/* H1 extras */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.cmp{background:#fff;border-radius:16px;padding:22px;box-shadow:var(--card-sh);border:1px solid var(--gray100)}
.cmp-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbadge{padding:3px 10px;font-size:13px;font-weight:600;border-radius:7px}
.qbadge.b{background:#EFF6FF;color:#1D4ED8}.qbadge.a{background:#FFFBEB;color:#B45309}
.cmp-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cmp-3 .cv{font-size:22px;font-weight:700}.cmp-3 .cl{font-size:12px;color:var(--gray500);margin-top:3px}
.cmp-sum{margin-top:14px;padding-top:14px;border-top:1px solid var(--gray100);font-size:14px;color:var(--gray500)}
.cmp-sum b{color:#1F2937;font-weight:600}
.act{display:flex;align-items:center;gap:14px;margin-bottom:11px}
.act .an{width:160px;font-size:14px;color:var(--gray700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.act .arow{flex:1;display:flex;align-items:center;gap:8px}
.act .atrack{flex:1;height:22px;background:var(--gray100);border-radius:9999px;overflow:hidden}
.act .afill{height:100%;border-radius:9999px}
.act .abadges{display:flex;gap:7px;font-size:12px;flex:none}
.act .q1t{padding:2px 7px;background:#EFF6FF;color:#1D4ED8;border-radius:5px}
.act .q2t{padding:2px 7px;background:#FFFBEB;color:#B45309;border-radius:5px}
.act .tot{font-weight:600;color:var(--gray700);width:50px;text-align:right}

/* TABLE */
.tbl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.tbl-head h3{margin:0}.tc{font-size:14px;color:var(--gray600)}
.tbl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl-tools input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;
  font-family:inherit;outline:none;width:220px}
.tbl-tools input:focus{border-color:var(--green)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
thead th{text-align:left;padding:12px 16px;font-size:13px;font-weight:600;color:var(--gray700);
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:14px 16px;font-size:14px;border-bottom:1px solid var(--gray100);vertical-align:top}
tbody tr:hover{background:var(--gray50)}
tbody tr:nth-child(even){background:rgba(249,250,251,.5)}
.cpill{display:inline-flex;padding:3px 10px;font-size:13px;font-weight:500;
  background:#F0FDF4;color:var(--green);border-radius:7px;white-space:nowrap}
.fbadge{display:inline-flex;padding:3px 10px;font-size:13px;border-radius:7px;white-space:nowrap}
.fbadge.off{background:#EFF6FF;color:#1D4ED8}.fbadge.on{background:#F5F3FF;color:#6D28D9}
.qtag{display:inline-flex;padding:2px 7px;font-size:12px;font-weight:600;border-radius:5px}
.qtag.q1{background:#EFF6FF;color:#1D4ED8}.qtag.q2{background:#FFFBEB;color:#B45309}
td.mut{color:var(--gray600)}
th.sortable{cursor:pointer;user-select:none;transition:.15s}
th.sortable:hover{color:var(--green);background:var(--gray50)}
th.sortable::after{content:"⇅";font-size:10px;opacity:.35;margin-left:5px}
.tab,.ibtn,.delbtn,.lbtn,.chip{cursor:pointer}
.delbtn{border:none;background:none;color:var(--gray400);cursor:pointer;padding:4px;
  border-radius:6px;transition:.15s}
.delbtn:hover{background:#FEF2F2;color:#DC2626}.delbtn svg{width:15px;height:15px;display:block}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.5);
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.modal-bg.show{display:flex}
.modal-card{background:#fff;border-radius:18px;width:100%;max-width:540px;
  box-shadow:0 30px 70px rgba(16,24,40,.25)}
.modal-h{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px;font-weight:600}
.modal-x{border:none;background:none;cursor:pointer;color:var(--gray400);font-size:22px;padding:4px}
.modal-b{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-b .full{grid-column:1/3}
.mf label{display:block;font-size:13px;font-weight:500;color:var(--gray700);margin-bottom:5px}
.mf input,.mf select,.mf textarea{width:100%;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;font-size:14px;font-family:inherit;outline:none}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--green)}
.mf textarea{resize:vertical;min-height:60px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;
  border-top:1px solid var(--line)}
.merr{color:#DC2626;font-size:13px;padding:0 24px;min-height:16px}

/* ACCT MODAL */
.acct-section{padding:20px 24px;border-bottom:1px solid var(--gray100)}
.acct-section:last-child{border:none}
.acct-section h4{font-size:14px;font-weight:600;margin-bottom:14px}
.asf{margin-bottom:12px}
.asf label{display:block;font-size:13px;font-weight:500;color:var(--gray700);margin-bottom:5px}
.asf input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:14px;font-family:inherit;outline:none}
.asf input:focus{border-color:var(--green)}
.acct-msg{font-size:13px;margin-top:8px;min-height:16px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
  z-index:120;opacity:0;transition:.25s;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}

/* BOOT */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--gray50);z-index:90}
.spin{width:26px;height:26px;border:3px solid var(--gray100);border-top-color:var(--green);
  border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot"><div><div class="spin"></div><div style="font-size:14px;color:var(--gray500)">Загрузка…</div></div></div>

<!-- LOGIN -->
<div id="loginPage" style="display:none">
  <div class="lcard">
    <div class="llogo"><svg viewBox="0 0 24 24" fill="none" width="28" height="28"><path d="M12 6.5C10.5 5.5 8 5 4 5v13c4 0 6.5.5 8 1.5 1.5-1 4-1.5 8-1.5V5c-4 0-6.5.5-8 1.5z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="#fff" stroke-width="1.7"/></svg></div>
    <h1>Обучение персонала</h1>
    <p>Авесто Групп · Войдите в свой аккаунт</p>
    <div class="field"><label>Логин (email)</label><input id="lu" type="email" placeholder="you@avesto.tj" autocomplete="email"></div>
    <div class="field"><label>Пароль</label><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"></div>
    <button class="lbtn" id="loginBtn">Войти</button>
    <div class="lerr" id="loginErr"></div>
    <div class="lhint">Нет аккаунта? Обратитесь к администратору.</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<nav>
  <div class="nav-in">
    <span class="nav-label">Обучение персонала</span>
    <button class="tab" data-tab="q1"><span class="t">I квартал</span><span class="s">Январь — Март 2026</span></button>
    <button class="tab on" data-tab="q2"><span class="t">II квартал</span><span class="s">Апрель — Июнь 2026</span></button>
    <button class="tab" data-tab="h1"><span class="t">Полугодие</span><span class="s">Январь — Июнь 2026</span></button>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="ibtn" id="acctBtn"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Аккаунт</span></button>
      <button class="ibtn" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Выйти</span></button>
    </div>
  </div>
</nav>
<div class="wrap" id="root"></div>
</div>

<!-- ADD COURSE MODAL -->
<div class="modal-bg" id="addModal">
  <div class="modal-card">
    <div class="modal-h"><h3 id="addTitle">Добавить курс</h3><button class="modal-x" id="addX">×</button></div>
    <div class="modal-b">
      <div class="mf"><label>Квартал</label><select id="mQ"><option value="q1">I квартал</option><option value="q2">II квартал</option></select></div>
      <div class="mf"><label>Месяц</label><select id="mMonth"></select></div>
      <div class="mf"><label>Компания</label><select id="mComp"></select></div>
      <div class="mf full" id="newCompRow" style="display:none"><label>Новая компания</label><input id="mCompNew" placeholder="Название компании"></div>
      <div class="mf full"><label>Название курса</label><textarea id="mName"></textarea></div>
      <div class="mf"><label>Формат</label><select id="mFmt"><option>Офлайн</option><option>Онлайн</option></select></div>
      <div class="mf"><label>Участники</label><input id="mPart" type="number" value="0" min="0"></div>
      <div class="mf"><label>Длительность</label><input id="mDur" placeholder="1 день (2 часа)"></div>
      <div class="mf"><label>Стоимость</label><input id="mCost" value="Бесплатно"></div>
      <div class="mf full"><label>Категория</label><input id="mCat" placeholder="Специалист"></div>
    </div>
    <div class="merr" id="addErr"></div>
    <div class="modal-f">
      <button class="ibtn" id="addCancel">Отмена</button>
      <button class="ibtn pri" id="addSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- ACCOUNT MODAL -->
<div class="modal-bg" id="acctModal">
  <div class="modal-card" style="max-width:440px">
    <div class="modal-h"><h3>Аккаунт</h3><button class="modal-x" id="acctX">×</button></div>
    <div class="acct-section">
      <div style="font-size:13px;color:var(--gray500)">Вы вошли как <b id="acctWho" style="color:var(--ink)"></b></div>
    </div>
    <div class="acct-section">
      <h4>Сменить пароль</h4>
      <div class="asf"><label>Новый пароль</label><input id="cpNew" type="password"></div>
      <div class="asf"><label>Повторите пароль</label><input id="cpNew2" type="password"></div>
      <button class="ibtn pri" id="cpSave" style="width:100%;justify-content:center;margin-top:4px">Сохранить пароль</button>
      <div class="acct-msg" id="cpMsg"></div>
    </div>
    <div class="acct-section" id="adminSection" style="display:none">
      <h4>Создать новый аккаунт</h4>
      <div class="asf"><label>Email</label><input id="naEmail" type="email" placeholder="user@avesto.tj"></div>
      <div class="asf"><label>Пароль</label><input id="naPass" type="password" placeholder="Минимум 6 символов"></div>
      <button class="ibtn" id="naSave" style="width:100%;justify-content:center;margin-top:4px">Создать аккаунт</button>
      <div class="acct-msg" id="naMsg"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

  'Гулистони Душанбе':'#F43F5E'
};
const NO_COURSE=['Зет Мобайл','Олуча','Сиёма','Сити Лайн','Артел','КОД','Филизот',
  'Сити Кард','Сити Сервис','Осиё Кемикал','Неру','Доро','Композит','Арвис'];
const META={q1:{p:288,s:2300},q2:{p:294,s:65531},h1:{p:582,s:67831}};

let allCourses=[], companies=[], curTab='q2', curUser=null, sortKey=null, sortDir=1, editId=null;
const fmt=n=>Number(n||0).toLocaleString('ru-RU');
let toastTimer;
function toast(m,ok=true){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}
function show(id,on){document.getElementById(id).style.display=on?'':'none';}

// ── AUTH ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){await enterApp(session.user);}
  else{show('boot',false);show('loginPage',true);}
}
document.getElementById('loginBtn').onclick=async()=>{
  const email=document.getElementById('lu').value.trim(),pass=document.getElementById('lp').value;
  document.getElementById('loginErr').textContent='';
  if(!email||!pass){document.getElementById('loginErr').textContent='Заполните все поля';return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('loginErr').textContent='Неверный email или пароль';return;}
  await enterApp(data.user);
};
['lu','lp'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();}));
document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};

async function enterApp(user){
  curUser=user;
  show('boot',false);show('loginPage',false);show('app',true);
  document.getElementById('navUser').textContent=user.email.split('@')[0];
  document.getElementById('acctWho').textContent=user.email;
  // Check if admin (first user or has admin role)
  const {data:profile}=await sb.from('profiles').select('role').eq('id',user.id).single();
  if(profile?.role==='admin'||!profile)show('adminSection',true);
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');renderTab(b.dataset.tab);});
  await loadData();
  renderTab('q2');
}

// ── DATA ──
async function loadData(){
  const {data:comp}=await sb.from('companies').select('*').order('name');
  companies=comp||[];
  const {data:c}=await sb.from('courses').select('*,companies(name)').order('id');
  allCourses=(c||[]).map(r=>({...r,company:r.companies?.name||''}));
}
function filterCourses(tab){
  let rows = tab==='h1'?allCourses.slice():allCourses.filter(c=>c.quarter===tab);
  if(sortKey){rows.sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(typeof x==='number'||typeof y==='number'){x=Number(x)||0;y=Number(y)||0;return (x-y)*sortDir;}
    return String(x||'').localeCompare(String(y||''),'ru')*sortDir;});}
  return rows;
}

// ── RENDER ──
function renderTab(tab){
  curTab=tab;
  const rows=filterCourses(tab);
  const [title,sub]=TITLES[tab];
  let html=`<div class="head"><h1>${title}</h1><p>${sub}</p></div>`;
  html+=kpiCards(tab,rows);
  if(tab==='h1')html+=h1Extras();
  html+=planWidget();
  html+=monthChart(tab);
  html+=courseTable(tab,rows);
  document.getElementById('root').innerHTML=html;
  wireTable();
}

function kpiCards(tab,rows){
  const comps=new Set(rows.map(r=>r.company)).size;
  const cost=rows.reduce((a,r)=>a+(Number(r.cost_num)||0),0);const parts=META[tab].p;
  const n=rows.length;
  return `<div class="kpi-grid">${[
    ['book',fmt(n),'Кол-во проведённых курсов'],
    ['users',fmt(parts),'Кол-во участников'],
    ['build',fmt(comps),'Кол-во компаний'],
    ['wallet',fmt(cost)+' c','Общая сумма курсов']
  ].map(([ic,v,l])=>`<div class="kpi"><div class="ic"><svg viewBox="0 0 24 24">${ICONS[ic]}</svg></div><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`;
}

function h1Extras(){
  const q1=filterCourses('q1'),q2=filterCourses('q2');
  const cmp=`<div class="cmp-grid">
    <div class="cmp"><div class="cmp-h"><span class="qbadge b">I квартал</span><span style="font-size:14px;color:var(--gray500)">Январь — Март</span></div>
      <div class="cmp-3"><div><div class="cv">${q1.length}</div><div class="cl">курсов</div></div><div><div class="cv">${META.q1.p}</div><div class="cl">участников</div></div><div><div class="cv">${new Set(q1.map(r=>r.company)).size}</div><div class="cl">компаний</div></div></div>
      <div class="cmp-sum">Сумма: <b>${fmt(q1.reduce((a,r)=>a+(Number(r.cost_num)||0),0))} c</b></div></div>
    <div class="cmp"><div class="cmp-h"><span class="qbadge a">II квартал</span><span style="font-size:14px;color:var(--gray500)">Апрель — Июнь</span></div>
      <div class="cmp-3"><div><div class="cv">${q2.length}</div><div class="cl">курсов</div></div><div><div class="cv">${META.q2.p}</div><div class="cl">участников</div></div><div><div class="cv">${new Set(q2.map(r=>r.company)).size}</div><div class="cl">компаний</div></div></div>
      <div class="cmp-sum">Сумма: <b>${fmt(q2.reduce((a,r)=>a+(Number(r.cost_num)||0),0))} c</b></div></div></div>`;
  const byComp={};allCourses.forEach(r=>{if(!byComp[r.company])byComp[r.company]={q1:0,q2:0};byComp[r.company][r.quarter]++;});
  const sorted=Object.entries(byComp).sort((a,b)=>(b[1].q1+b[1].q2)-(a[1].q1+a[1].q2));
  const maxTot=Math.max(...sorted.map(([,v])=>v.q1+v.q2),1);
  const bars=sorted.map(([name,v])=>{const tot=v.q1+v.q2,w=Math.round(tot/maxTot*100),col=COMPANY_COLORS[name]||'#9CA3AF';
    return `<div class="act"><div class="an" title="${name}">${name}</div><div class="arow">
      <div class="atrack"><div class="afill" style="width:${w}%;min-width:${tot>0?20:0}px;background:${col}"></div></div>
      <div class="abadges">${v.q1>0?`<span class="q1t">${v.q1} Q1</span>`:''}${v.q2>0?`<span class="q2t">${v.q2} Q2</span>`:''}<span class="tot">${tot} кур.</span></div>
    </div></div>`;}).join('');
  return cmp+`<div class="card"><h3>Активность по компаниям</h3>${bars}</div>`;
}

function planWidget(){
  const total=23,done=6,no=17,pct=26;
  const R=75,C=110,len=2*Math.PI*R,frac=done/total;
  const check='<svg fill="none" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const cross='<svg fill="none" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return `<div class="card"><h3>Выполнение плана потребности 2026</h3><div class="plan-grid">
    <div class="donut-box"><div class="donut-rel"><svg width="220" height="220" viewBox="0 0 220 220">
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#E5E7EB" stroke-width="26"/>
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#66B67A" stroke-width="26"
        stroke-dasharray="${(frac*len).toFixed(1)} ${len}" transform="rotate(-90 ${C} ${C})"/></svg>
      <div class="donut-center"><div><div class="pc">${pct}%</div><div class="pl">выполнено</div></div></div></div></div>
    <div class="plan-stats">
      <div class="pstat g"><div><div class="pl">План на 2026 год</div><div class="pv">${total}</div></div><div class="pcircle g"><svg viewBox="0 0 24 24">${ICONS.book}</svg></div></div>
      <div class="pstat g done"><div><div class="pl">Выполнено</div><div class="pv">${done}</div></div><div class="pcircle g">${check}</div></div>
      <div class="pstat x"><div><div class="pl">Не выполнено</div><div class="pv">${no}</div></div><div class="pcircle x">${cross}</div></div>
    </div></div>
    <div class="nocourse"><h4>Компании без проведенных курсов</h4><div class="chips">${NO_COURSE.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div>`;
}

function monthChart(tab){
  const rows=filterCourses(tab);
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь'];
  const idx = tab==='q1'?[1,2,3]:tab==='q2'?[4,5,6]:[1,2,3,4,5,6];
  const compSet=[...new Set(rows.map(r=>r.company))].filter(Boolean);
  const data=idx.map(mi=>{
    const d={month:MONTHS[mi-1]};
    compSet.forEach(c=>d[c]=rows.filter(r=>r.company===c&&r.month_index===mi).length);
    return d;});
  const W=1060,H=340,mL=40,mR=20,mT=20,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  let max=0;data.forEach(d=>compSet.forEach(c=>{if(d[c]>max)max=d[c];}));
  max=Math.max(max,1);
  const step=Math.max(1,Math.ceil(max/4));const ticks=[];
  for(let t=0;t<=max;t+=step)ticks.push(t);
  if(ticks[ticks.length-1]<max)ticks.push(ticks[ticks.length-1]+step);
  const topV=ticks[ticks.length-1],y=v=>mT+ih-(v/topV)*ih,gW=iw/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg">`;
  ticks.forEach(t=>{const yy=y(t);s+=`<line x1="${mL}" y1="${yy}" x2="${W-mR}" y2="${yy}" stroke="#E5E7EB" stroke-dasharray="3 3"/><text x="${mL-7}" y="${yy+4}" text-anchor="end" font-size="12" fill="#6B7280" font-family="Inter">${t}</text>`;});
  data.forEach((d,mi)=>{
    const pr=compSet.filter(c=>d[c]>0),n=pr.length||1;
    const pad=gW*0.12,bw=Math.min(26,(gW-pad*2)/n-4),gw=(bw+4)*n-4,x0=mL+mi*gW+(gW-gw)/2;
    pr.forEach((c,ci)=>{const bx=x0+ci*(bw+4),bh=(d[c]/topV)*ih,by=mT+ih-bh,col=COMPANY_COLORS[c]||'#9CA3AF';
      s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${col}"><title>${c} · ${d.month}: ${d[c]}</title></rect>`;});
    s+=`<text x="${mL+mi*gW+gW/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter">${d.month}</text>`;});
  s+=`<line x1="${mL}" y1="${mT+ih}" x2="${W-mR}" y2="${mT+ih}" stroke="#E5E7EB"/></svg>`;
  const legend=`<div class="legend">${compSet.map(c=>`<span><i style="background:${COMPANY_COLORS[c]||'#9CA3AF'}"></i>${c}</span>`).join('')}</div>`;
  return `<div class="card"><h3>Курсы по месяцам</h3>${s}${legend}</div>`;
}

function courseTable(tab,rows){
  const totalP=rows.reduce((s,r)=>s+(r.participants||0),0);
  const wq=tab==='h1';
  const body=rows.map((r,i)=>`<tr>
    <td>${i+1}</td>${wq?`<td><span class="qtag ${r.quarter}">${r.quarter.toUpperCase()}</span></td>`:''}
    <td><span class="cpill">${r.company}</span></td>
    <td>${r.course_name||''}</td>
    <td><span class="fbadge ${r.format==='Офлайн'?'off':'on'}">${r.format||''}</span></td>
    <td>${r.participants||0}</td><td class="mut">${r.duration||''}</td>
    <td>${r.cost_raw||''}</td><td class="mut">${r.category||''}</td>
    <td style="white-space:nowrap">
      <button class="delbtn" data-edit="${r.id}" title="Редактировать"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4l10-10a2.8 2.8 0 10-4-4L4 16v4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      <button class="delbtn" data-del="${r.id}" title="Удалить"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v12a1 1 0 01-1 1H8a1 1 0 01-1-1V7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </td></tr>`).join('');
  return `<div class="card"><div class="tbl-head"><h3>Общий список курсов</h3>
    <div class="tbl-tools">
      <input id="tsearch" placeholder="Поиск…">
      <span class="tc">Всего курсов: ${rows.length} | Всего участников: ${fmt(totalP)}</span>
      <button class="ibtn pri" id="openAddBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Добавить курс</button>
    </div></div>
    <div class="tbl-scroll"><table><thead><tr><th>№</th>${wq?'<th class="sortable" data-sort="quarter">Кв.</th>':''}<th class="sortable" data-sort="company">Компания</th><th class="sortable" data-sort="course_name">Название курса</th><th class="sortable" data-sort="format">Формат</th><th class="sortable" data-sort="participants">Участники</th><th>Длительность</th><th class="sortable" data-sort="cost_num">Стоимость</th><th class="sortable" data-sort="category">Категория</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
}

function wireTable(){
  document.getElementById('tsearch')?.addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('#root tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none');});
  document.getElementById('openAddBtn')?.addEventListener('click',openAdd);
  document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.sort;
    if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}
    renderTab(curTab);}));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEdit(+b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Удалить курс?'))return;
    const {error}=await sb.from('courses').delete().eq('id',+b.dataset.del);
    if(error){toast('Ошибка: '+error.message,false);return;}
    allCourses=allCourses.filter(c=>c.id!==+b.dataset.del);
    renderTab(curTab);toast('Курс удалён');
  }));
}

// ── ADD / EDIT MODAL ──
const MONTHS_ALL=['Январь','Февраль','Март','Апрель','Май','Июнь'];
function fillMonths(q,sel){
  const el=document.getElementById('mMonth');
  const idx=q==='q1'?[1,2,3]:[4,5,6];
  el.innerHTML=idx.map(i=>`<option value="${i}">${MONTHS_ALL[i-1]}</option>`).join('');
  if(sel)el.value=sel;
}
document.getElementById('mQ').addEventListener('change',e=>fillMonths(e.target.value));
function fillCompanySelect(sel){
  const el=document.getElementById('mComp');
  el.innerHTML=companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')+'<option value="__new__">+ Новая компания…</option>';
  if(sel)el.value=sel;
}
function openEdit(id){
  const r=allCourses.find(c=>c.id===id);if(!r)return;
  editId=id;
  document.getElementById('addTitle').textContent='Редактировать курс';
  document.getElementById('addErr').textContent='';
  document.getElementById('mQ').value=r.quarter;
  fillMonths(r.quarter,r.month_index);
  fillCompanySelect(r.company_id);
  document.getElementById('newCompRow').style.display='none';
  document.getElementById('mName').value=r.course_name||'';
  document.getElementById('mFmt').value=r.format||'Офлайн';
  document.getElementById('mPart').value=r.participants||0;
  document.getElementById('mDur').value=r.duration||'';
  document.getElementById('mCost').value=r.cost_raw||'';
  document.getElementById('mCat').value=r.category||'';
  document.getElementById('addModal').classList.add('show');
}
function openAdd(){
  editId=null;
  document.getElementById('addTitle').textContent='Добавить курс';
  document.getElementById('addErr').textContent='';
  const q=curTab==='h1'?'q2':curTab;
  document.getElementById('mQ').value=q;
  fillMonths(q);
  fillCompanySelect();
  ['mName','mDur','mCat','mCompNew'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mPart').value=0;document.getElementById('mCost').value='Бесплатно';
  document.getElementById('mFmt').value='Офлайн';document.getElementById('newCompRow').style.display='none';
  document.getElementById('addModal').classList.add('show');
}
document.getElementById('mComp').addEventListener('change',e=>{
  document.getElementById('newCompRow').style.display=e.target.value==='__new__'?'block':'none';});
function closeAdd(){document.getElementById('addModal').classList.remove('show');}
document.getElementById('addX').onclick=closeAdd;
document.getElementById('addCancel').onclick=closeAdd;
document.getElementById('addModal').onclick=e=>{if(e.target===document.getElementById('addModal'))closeAdd();};
document.getElementById('addSave').onclick=async()=>{
  const btn=document.getElementById('addSave');
  const err=document.getElementById('addErr');err.textContent='';
  const q=document.getElementById('mQ').value;
  let compId=document.getElementById('mComp').value,compName='';
  if(compId==='__new__'){
    const newName=document.getElementById('mCompNew').value.trim();
    if(!newName){err.textContent='Укажите название компании';return;}
    btn.disabled=true;
    const {data:nc,error:ce}=await sb.from('companies').insert({name:newName}).select().single();
    btn.disabled=false;
    if(ce){err.textContent='Ошибка: '+ce.message;return;}
    companies.push(nc);companies.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    compId=nc.id;compName=newName;
  }else{compName=companies.find(c=>c.id==compId)?.name||'';}
  const name=document.getElementById('mName').value.trim();
  if(!name){err.textContent='Укажите название курса';return;}
  const costRaw=document.getElementById('mCost').value.trim()||'—';
  const costNum=/беспл/i.test(costRaw)?0:(parseFloat(costRaw.replace(/[^\d.,]/g,'').replace(',','.'))||null);
  const payload={
    quarter:q,company_id:Number(compId),course_name:name,
    format:document.getElementById('mFmt').value,
    participants:parseInt(document.getElementById('mPart').value)||0,
    duration:document.getElementById('mDur').value.trim(),
    cost_raw:costRaw,cost_num:costNum,
    category:document.getElementById('mCat').value.trim(),
    month_index:Number(document.getElementById('mMonth').value)||null
  };
  btn.disabled=true;btn.textContent='Сохранение…';
  let res;
  if(editId){
    res=await sb.from('courses').update(payload).eq('id',editId).select('*,companies(name)').single();
  }else{
    res=await sb.from('courses').insert({...payload,created_by:curUser.id}).select('*,companies(name)').single();
  }
  btn.disabled=false;btn.textContent='Сохранить';
  if(res.error){err.textContent='Ошибка: '+res.error.message;return;}
  const row={...res.data,company:res.data.companies?.name||compName};
  if(editId){allCourses=allCourses.map(c=>c.id===editId?row:c);}
  else{allCourses.push(row);}
  const wasEdit=!!editId;editId=null;
  closeAdd();renderTab(curTab);
  toast(wasEdit?'Изменения сохранены в базу':'Курс добавлен и сохранён в базу');
};

// ── ACCOUNT MODAL ──
document.getElementById('acctBtn').onclick=()=>{document.getElementById('acctModal').classList.add('show');['cpNew','cpNew2','naEmail','naPass'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.getElementById('cpMsg').textContent='';document.getElementById('naMsg').textContent='';};
document.getElementById('acctX').onclick=()=>document.getElementById('acctModal').classList.remove('show');
document.getElementById('acctModal').onclick=e=>{if(e.target===document.getElementById('acctModal'))document.getElementById('acctModal').classList.remove('show');};
document.getElementById('cpSave').onclick=async()=>{
  const p=document.getElementById('cpNew').value,p2=document.getElementById('cpNew2').value,msg=document.getElementById('cpMsg');
  if(p.length<6){msg.style.color='#DC2626';msg.textContent='Минимум 6 символов';return;}
  if(p!==p2){msg.style.color='#DC2626';msg.textContent='Пароли не совпадают';return;}
  const {error}=await sb.auth.updateUser({password:p});
  if(error){msg.style.color='#DC2626';msg.textContent=error.message;return;}
  msg.style.color='#16A34A';msg.textContent='Пароль изменён';toast('Пароль изменён');
};
document.getElementById('naSave')?.addEventListener('click',async()=>{
  const email=document.getElementById('naEmail').value.trim(),pass=document.getElementById('naPass').value,msg=document.getElementById('naMsg');
  if(!email||!pass){msg.style.color='#DC2626';msg.textContent='Заполните все поля';return;}
  if(pass.length<6){msg.style.color='#DC2626';msg.textContent='Пароль минимум 6 символов';return;}
  const {data,error}=await sb.auth.admin?sb.auth.admin.createUser({email,password:pass,email_confirm:true}):
    {data:null,error:{message:'Нет прав администратора'}};
  if(error){msg.style.color='#DC2626';msg.textContent=error.message;return;}
  msg.style.color='#16A34A';msg.textContent='Аккаунт создан: '+email;toast('Аккаунт создан');
});

init();
</script>
